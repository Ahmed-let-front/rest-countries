<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore comprehensive data about all countries worldwide, including population, capitals, regions, currencies, and borders with our interactive REST Countries web application."
    />
    <script type="module" src="./src/js/main.js"></script>
    <title>REST Countries | Discover the World</title>
  </head>
  <body>
    <header class="header-custom">
      <h1 class="text-sm md:text-2xl font-extrabold tracking-tigh">
        Where in the world?
      </h1>
      <button
        type="button"
        id="theme-trigger"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="theme-modal"
        class="flex items-center gap-2 text-sm font-semibold hover:opacity-80 transition-opacity cursor-pointer rounded-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-main focus-visible:ring-offset-2 focus-visible:ring-offset-base"
      >
        <svg class="w-4 h-4 md:w-5 md:h-5">
          <use href="/sprite.svg#icon-monitor" id="theme-icon"></use>
        </svg>
        <span><span id="theme-text" class="capitalize">System</span> Mode</span>
      </button>
    </header>

    <main class="container-custom">
      <div
        class="flex flex-col flex-wrap md:flex-row justify-between items-start md:items-center gap-10 md:gap-4 mb-8 md:mb-12"
        aria-label="Search and Filter"
      >
        <form class="relative w-full md:w-[480px]" role="search" id="search-form">
          <div
            class="absolute inset-y-0 left-0 pl-8 flex items-center pointer-events-none"
          >
            <svg class="w-4 h-4 text-sub">
              <use href="/sprite.svg#icon-search"></use>
            </svg>
          </div>
          <label for="search" class="sr-only">Search for a country</label>
          <input
            type="text"
            id="search-input"
            name="search"
            placeholder="Search for a country..."
            class="w-full py-3.5 pl-14 pr-4 bg-element text-main shadow-element rounded-sm text-sm font-light placeholder:text-sub focus:outline-none"
          />
        </form>

        <details class="group relative w-full md:w-[200px]" id="filterByRegionContainer">
          <summary
            class="filter-select [&::-webkit-details-marker]:hidden rounded-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-main focus-visible:ring-offset-2 focus-visible:ring-offset-base"
            aria-expanded="false"
          >
            <span id="summary-region">Filter by Region</span>
            <svg
              class="w-4 h-4 text-sub transition-transform duration-200 group-open:rotate-180"
            >
              <use href="/sprite.svg#icon-chevron"></use>
            </svg>
          </summary>
          <ul
            class="absolute top-full left-0 mt-1 w-full bg-element text-main shadow-element rounded-sm py-1 z-20 group-open:animate-[slideDown_1s_forwards]"
            id="region-filter"
          >
            <li>
              <button data-region="All" class="dropdown-item w-full text-left">
                All
              </button>
            </li>
            <li>
              <button data-region="Africa" class="dropdown-item w-full text-left">
                Africa
              </button>
            </li>
            <li>
              <button data-region="Americas" class="dropdown-item w-full text-left">
                Americas
              </button>
            </li>
            <li>
              <button data-region="Asia" class="dropdown-item w-full text-left">
                Asia
              </button>
            </li>
            <li>
              <button data-region="Europe" class="dropdown-item w-full text-left">
                Europe
              </button>
            </li>
            <li>
              <button data-region="Oceania" class="dropdown-item w-full text-left">
                Oceania
              </button>
            </li>
          </ul>
        </details>
      </div>

      <ul
        class="grid grid-cols-[repeat(auto-fit,minmax(13rem,1fr))] gap-10 md:gap-16 justify-items-center items-center"
        aria-label="Countries list"
        id="countries-list"
      ></ul>
      <div id="countryDetails"></div>
      <div
        class="col-span-full flex justify-center flex-wrap items-center gap-4 my-10 disabled-container"
        id="pagination-container"
        aria-label="Pagination Navigation"
      >
        <button
          data-goto="1"
          class="flex items-center gap-2 px-5 py-2.5 bg-element text-main shadow-element rounded-sm text-sm font-semibold hover:opacity-80 transition-opacity cursor-pointer btn-pag"
          id="btn-pag-prev"
        >
          <svg class="w-4 h-4 text-sub">
            <use href="./sprite.svg#icon-arrow-left"></use>
          </svg>
          <span>Page <span id="numPage" aria-live="polite">--</span></span>
        </button>
        <div
          class="px-4 py-2.5 bg-element text-main shadow-element rounded-sm text-xs font-medium tracking-wide order-1 sm:order-0"
          id="pages-count-display"
        >
          Page <span id="current-page" class="font-bold" aria-live="polite">--</span> of
          <output id="total-pages" class="font-bold">--</output>
        </div>
        <button
          data-goto="2"
          class="flex items-center gap-2 px-5 py-2.5 bg-element text-main shadow-element rounded-sm text-sm font-semibold hover:opacity-80 transition-opacity cursor-pointer btn-pag"
          id="btn-pag-next"
        >
          <span>Page <span id="numPage" aria-live="polite">--</span></span>
          <svg class="w-4 h-4 text-sub">
            <use href="./sprite.svg#icon-arrow-right"></use>
          </svg>
        </button>
      </div>
    </main>

    <dialog
      id="theme-modal"
      aria-modal="true"
      aria-labelledby="theme-modal-title"
      class="modal-dialog"
    >
      <div class="modal-content">
        <div class="flex justify-between items-center">
          <h2 id="theme-modal-title" class="text-xl font-bold">Choose Theme</h2>
          <button
            type="button"
            id="btn-close-modal-theme"
            class="text-sub hover:text-main transition-colors p-1 rounded-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-main focus-visible:ring-offset-2 focus-visible:ring-offset-base cursor-pointer"
            aria-label="Close dialog"
          >
            <svg class="w-5 h-5">
              <use href="/sprite.svg#icon-close"></use>
            </svg>
          </button>
        </div>

        <form id="theme-form" class="flex flex-col gap-3 mt-2">
          <label
            class="modal-option rounded-sm border border-transparent has-[:checked]:border-sub"
          >
            <input type="radio" name="theme" value="light" class="sr-only" />
            <div class="modal-option-box">
              <span>Light Mode</span>
              <svg class="w-4 h-4 text-sub">
                <use href="/sprite.svg#icon-sun"></use>
              </svg>
            </div>
          </label>

          <label
            class="modal-option rounded-sm border border-transparent has-[:checked]:border-sub"
          >
            <input type="radio" name="theme" value="dark" class="sr-only" />
            <div class="modal-option-box">
              <span>Dark Mode</span>
              <svg class="w-4 h-4 text-sub">
                <use href="/sprite.svg#icon-moon"></use>
              </svg>
            </div>
          </label>

          <label
            class="modal-option rounded-sm focus:border-sub border border-transparent has-[:checked]:border-sub"
          >
            <input type="radio" name="theme" value="system" class="sr-only" checked />
            <div class="modal-option-box">
              <span>System Preference</span>
              <svg class="w-4 h-4 text-sub">
                <use href="/sprite.svg#icon-monitor"></use>
              </svg>
            </div>
          </label>
        </form>
      </div>
    </dialog>
  </body>
</html>
